[project]
name = "ctxfw"
version = "3.4.0"
description = "Deterministic AST-based Token and Context Optimization Engine with SQLite WAL Cache & XDG Storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
ctxfw = "ctxfw.cli:main"
ctxfw-init = "ctxfw.cli:init_entrypoint"
ctxfw-mcp = "ctxfw.mcp:main"
ctxfw-proxy = "ctxfw.proxy:main"
ctxfw-ci = "ctxfw.gatekeeper:main"
ctxfw-audit = "ctxfw.auditor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
