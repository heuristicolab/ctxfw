[project]
name = "heuristico-core-optimizer"
version = "1.0.0"
description = "Deterministic AST-based Token and Context Optimization Engine with SQLite WAL Cache"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-java",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
