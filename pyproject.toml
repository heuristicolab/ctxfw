# manifest_hash: 7c09f2047bbb42996eff3c58758a46a3ecb7850815a83c94fee6a8f12353bf5d
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxfw"
version = "4.1.1"
description = "AI Agent Governance, Prompt Injection Firewall (SARA) & Deterministic AST Context Compactor for MCP Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Heuristico Lab", email = "mo@heuristicolab.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-governance",
    "prompt-injection-firewall",
    "ast-pruning",
    "tree-sitter",
    "token-optimization",
    "coding-agents",
    "sqlite-wal",
    "deterministic-ai"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed"
]
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://ctxfw.heuristicolab.com"
Documentation = "https://github.com/heuristicolab/ctxfw#readme"
Repository = "https://github.com/heuristicolab/ctxfw"
Issues = "https://github.com/heuristicolab/ctxfw/issues"
Changelog = "https://github.com/heuristicolab/ctxfw/releases"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ctxfw = "ctxfw.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxfw"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ctxfw",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/.gitattributes",
    "/glama.json",
    "/server.json",
    "/SPEC.axioms.md"
]
exclude = [
    "/.agents",
    "/benchmarks",
    "/docs",
    "/logos",
    "/scripts",
    "/tests",
    "*.db"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient"
]
