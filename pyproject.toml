[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctxfw"
version = "3.9.0"
description = "Deterministic Context Firewall & AST Ambient Pruner for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Heuristico LAB // Skunk Works Division", email = "mo@heuristicolab.com" }
]
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.urls]
Homepage = "https://ctxfw.heuristicolab.com"
Documentation = "https://github.com/heuristicolab/ctxfw#readme"
Repository = "https://github.com/heuristicolab/ctxfw"
Issues = "https://github.com/heuristicolab/ctxfw/issues"
Changelog = "https://github.com/heuristicolab/ctxfw/releases"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ctxfw = "ctxfw.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ctxfw"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ctxfw",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml"
]
exclude = [
    "/benchmarks",
    "/tests",
    "/docs/reports",
    "*.db"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
