server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate /etc/nginx/ssl-certificates/heuristicolab.com.crt;
  ssl_certificate_key /etc/nginx/ssl-certificates/heuristicolab.com.key;
  server_name ctxfw.heuristicolab.com;
  root /home/heuristicolab-ctxfw/htdocs/ctxfw.heuristicolab.com;

  access_log /home/heuristicolab-ctxfw/logs/nginx/access.log main;
  error_log /home/heuristicolab-ctxfw/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  # Proxy Mission Control & Event Stream
  location ~ ^/(mission-control|events|api) {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ajustes SSE (Server-Sent Events) sin buffering
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
  }

  include /etc/nginx/global_settings;

  index index.html;

  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|gz|svg|svgz|ttf|otf|woff|woff2|eot|mp4|ogg|ogv|webm|webp|zip|swf)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header alt-svc 'h3=":443"; ma=86400';
    expires max;
    access_log off;
  }

  if (-f $request_filename) {
    break;
  }
}
