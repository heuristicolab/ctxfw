name: Hermetic TDD Verification Matrix
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tdd-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Hermetic Python Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq && apt-get install -y -qq python3-venv python3-pip sqlite3
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --no-cache-dir "pydantic>=2.0" pytest

      - name: Compile AST & Validate SQL
        run: |
          . .venv/bin/activate
          python3 -m py_compile contracts.py test_contracts.py
          if [ -f "schema.sql" ]; then
            python3 -c "import sqlite3; con = sqlite3.connect(':memory:'); con.executescript(open('schema.sql').read()); print('SQL DDL Verified.')"
          fi

      - name: Execute Pytest TDD Matrix
        run: |
          . .venv/bin/activate
          pytest test_contracts.py -v --tb=short
