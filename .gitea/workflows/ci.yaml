name: Hermetic TDD Verification Matrix
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tdd-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code via Clean Host Resolution
        run: |
          CLEAN_HOST=$(echo "${{ gitea.server_url }}" | sed 's|https://||; s|http://||')
          git clone --depth 1 "https://${{ gitea.actor }}:${{ secrets.GITEA_TOKEN || secrets.GITHUB_TOKEN }}@${CLEAN_HOST}/${{ gitea.repository }}.git" .

      - name: Verify Artifact Completeness
        run: |
          if [ ! -f "test_suite.py" ] && [ ! -f "4_test_suite.py" ]; then
            echo "⚠️ Artefactos en proceso de forja. Omitiendo suite temporal."
            exit 0
          fi

      - name: Setup Hermetic Runtime & Dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq python3 python3-pip git sqlite3
          python3 -m pip install --no-cache-dir "pydantic>=2.0" pytest PyNaCl

      - name: Compile AST & Validate SQL
        run: |
          python3 -m py_compile contracts.py test_suite.py || python3 -m py_compile 2_pydantic_contracts.py 4_test_suite.py
          if [ -f "schema.sql" ]; then sqlite3 :memory: < schema.sql; fi

      - name: Execute Pytest TDD Matrix
        run: |
          python3 -m pytest test_suite.py -v --tb=short || python3 -m pytest 4_test_suite.py -v --tb=short || python3 -m pytest test_contracts.py -v --tb=short
