# manifest_hash: 7c09f2047bbb42996eff3c58758a46a3ecb7850815a83c94fee6a8f12353bf5d
name: Hermetic TDD & Multiplatform Standalone CI Matrix
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tdd-attestation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Pure Dependencies & Package
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Compile AST & Validate SQL
        run: |
          python3 -m compileall src/ tests/
          python3 -c "import sqlite3; con = sqlite3.connect(':memory:'); con.executescript(open('src/ctxfw/storage/schema.sql').read()); print('SQL DDL Verified.')"

      - name: Execute Pytest TDD Matrix (Python ${{ matrix.python-version }} Environment)
        run: |
          python3 -m pytest tests/ -v --tb=short

  build-binaries:
    needs: [ tdd-attestation ]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.10 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Toolchain
        run: pip install -r requirements.txt

      - name: Build Standalone Executable (Zero-Python Toolchain)
        run: python scripts/build_standalone.py

      - name: Upload Standalone Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctxfw-${{ matrix.os }}
          path: dist/ctxfw*

  publish-mcp-registry:
    needs: [ tdd-attestation ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Official MCP Registry Publisher (v1.8.4)
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate server.json Schema
        run: ./mcp-publisher validate

      - name: Idempotent Check & Publish via GitHub OIDC to Official Anthropic MCP Registry
        run: |
          TARGET_VER=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          ALREADY_PUBLISHED=$(python3 -c "import urllib.request, json; r = json.loads(urllib.request.urlopen('https://registry.modelcontextprotocol.io/v0/servers?search=ctxfw', timeout=15).read()); print(any(s.get('server', {}).get('name') == 'io.github.heuristicolab/ctxfw' and s.get('server', {}).get('version') == '$TARGET_VER' for s in r.get('servers', [])))")
          if [ "$ALREADY_PUBLISHED" = "True" ]; then
            echo "✅ io.github.heuristicolab/ctxfw@$TARGET_VER is already active in Official Anthropic MCP Registry — skipping duplicate publish."
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
