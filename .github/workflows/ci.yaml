name: Hermetic TDD & Multiplatform Standalone CI Matrix
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  tdd-attestation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pure Dependencies & Package
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Compile AST & Validate SQL
        run: |
          python3 -m py_compile contracts.py topological_resolver.py finops_auditor.py polyglot_pruner.py mcp_server.py proxy_gateway.py ci_gatekeeper.py firewall_cli.py tests/test_contracts.py
          python3 -m compileall src/
          python3 -c "import sqlite3; con = sqlite3.connect(':memory:'); con.executescript(open('schema.sql').read()); print('SQL DDL Verified.')"

      - name: Execute Pytest TDD Matrix (Python 3.12 Environment)
        run: |
          python3 -m pytest tests/ -v --tb=short

  build-binaries:
    needs: [ tdd-attestation ]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.10 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies & Toolchain
        run: pip install -r requirements.txt

      - name: Build Standalone Executable (Zero-Python Toolchain)
        run: python scripts/build_standalone.py

      - name: Upload Standalone Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctxfw-${{ matrix.os }}
          path: dist/ctxfw*
