name: "Setup ctxfw Headless Environment"
description: "Composite GitHub Action for headless initialization, dependency caching, and verification of Context Firewall (ctxfw)"
author: "Heuristico LAB // Skunk Works Division"

inputs:
  python-version:
    description: "Python version to set up (minimum >= 3.10)"
    required: false
    default: "3.11"
  cache-key-suffix:
    description: "Optional suffix for the cache key"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python Runtime (>= 3.10)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache ctxfw Dependencies and Local Ledger
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/ctxfw
          ~/.cache/pip
        key: ${{ runner.os }}-ctxfw-${{ hashFiles('**/pyproject.toml') }}${{ inputs.cache-key-suffix }}
        restore-keys: |
          ${{ runner.os }}-ctxfw-

    - name: Install ctxfw Package in Editable Mode
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Atomic Verification of ctxfw Version
      shell: bash
      run: |
        ctxfw --version
